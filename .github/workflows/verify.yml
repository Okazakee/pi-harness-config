name: verify

# Independent verification layer.
#
# Git hooks are developer feedback and can be bypassed with --no-verify.
# This workflow is the authority: it repeats the repository contract, the
# secret-scanner self-test, the full-history secret scan and the isolated
# integration tests in a clean environment.
#
# Every action is pinned to an exact commit SHA. TruffleHog is not taken
# from a floating tag: scripts/install-trufflehog.sh installs the exact
# version pinned in deps/tools.lock.json and verifies its SHA-256 first.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history is required: the secret scan walks every commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Runner for the cwd-switch extension tests. Action and runtime are both
      # pinned so the result does not drift with a new bun release.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install pinned TruffleHog (SHA-256 verified)
        run: |
          ./scripts/install-trufflehog.sh --dest "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          trufflehog --version
          bash --version | head -n 1
          python3 --version
          git --version
          bun --version

      - name: Repository contract
        run: ./scripts/check-repo.sh

      # Must run before the history scan: a clean result from a scanner
      # that no longer detects anything proves nothing.
      - name: Secret scanner self-test
        run: ./scripts/check-secret-scanner.sh

      - name: Secret scan (full history)
        run: ./scripts/check-secrets.sh --history

      - name: Backup/restore isolated test
        run: ./scripts/test-backup-restore.sh

      - name: Renderer patch isolated test
        run: ./scripts/test-renderer-patch.sh

      - name: Obscura lock and checksum test
        run: ./scripts/test-obscura-restore.sh

      - name: cwd-switch extension tests
        run: ./scripts/test-cwd-switch.sh

      - name: todo extension tests
        run: ./scripts/test-todo.sh

      - name: Statusline provider-usage tests
        run: ./scripts/test-statusline.sh

      - name: Version discovery tests
        run: ./scripts/test-versions.sh
